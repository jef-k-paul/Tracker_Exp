<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.3" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Modern Rounded Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Outer Glass Border -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" />

  <g filter="url(#glow)">
    <!-- Credit Card Peeking Out -->
    <rect x="20" y="12" width="24" height="15" rx="3" fill="url(#cardGrad)" />
    <rect x="23" y="16" width="6" height="4" rx="1" fill="#ffffff" fill-opacity="0.8" />
    <line x1="20" y1="21" x2="44" y2="21" stroke="#0f172a" stroke-width="1.5" stroke-opacity="0.3" />

    <!-- Main Wallet Body -->
    <rect x="12" y="20" width="40" height="28" rx="6" fill="#ffffff" />

    <!-- Wallet Pocket Flap -->
    <path d="M 37 28 L 47 28 C 49.5 28 51.5 30 51.5 32.5 L 51.5 35.5 C 51.5 38 49.5 40 47 40 L 37 40 C 34.5 40 32.5 38 32.5 35.5 L 32.5 32.5 C 32.5 30 34.5 28 37 28 Z" fill="#0284c7" />
    <!-- Clasp Stud -->
    <circle cx="43.5" cy="34" r="2.2" fill="#ffffff" />

    <!-- Trend Analytics Bars inside wallet -->
    <rect x="17" y="36" width="3.2" height="6" rx="1.6" fill="#0284c7" />
    <rect x="22.5" y="31" width="3.2" height="11" rx="1.6" fill="#0284c7" />
    <rect x="28" y="26" width="3.2" height="16" rx="1.6" fill="#38bdf8" />
  </g>
</svg>
